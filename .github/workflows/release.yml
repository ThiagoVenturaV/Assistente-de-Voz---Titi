name: Release verificável

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag imutável já existente que deve ser retomada"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  package-and-publish:
    name: Empacotar, verificar e publicar
    runs-on: windows-latest
    timeout-minutes: 90
    env:
      CSC_LINK: ${{ secrets.WINDOWS_CSC_LINK }}
      CSC_KEY_PASSWORD: ${{ secrets.WINDOWS_CSC_KEY_PASSWORD }}
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      TITI_WINDOWS_SIGNER_SUBJECT: ${{ vars.WINDOWS_SIGNER_SUBJECT }}
      TITI_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Baixar o commit exato da tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.TITI_RELEASE_TAG }}
          persist-credentials: false

      - name: Preparar pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.22.0

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Validar tag e política de assinatura
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $expectedTag = "v$version"
          if ($env:TITI_RELEASE_TAG -ne $expectedTag) {
            throw "A tag $env:TITI_RELEASE_TAG não corresponde à versão $version (esperado: $expectedTag)."
          }

          $headCommit = (& git rev-parse HEAD).Trim()
          $tagCommit = (& git rev-parse "$($env:TITI_RELEASE_TAG)^{commit}").Trim()
          if ($LASTEXITCODE -ne 0 -or $headCommit -ne $tagCommit) {
            throw "O checkout não corresponde ao commit imutável de $env:TITI_RELEASE_TAG."
          }
          "TITI_RELEASE_COMMIT=$headCommit" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

          $hasCertificate = -not [string]::IsNullOrWhiteSpace($env:CSC_LINK)
          $hasPassword = -not [string]::IsNullOrWhiteSpace($env:CSC_KEY_PASSWORD)
          if ($hasCertificate -ne $hasPassword) {
            throw "WINDOWS_CSC_LINK e WINDOWS_CSC_KEY_PASSWORD devem ser configurados juntos."
          }

          $isPrerelease = $version.Contains('-')
          if (-not $hasCertificate -and -not $isPrerelease) {
            throw "Uma versão estável não pode ser publicada sem certificado Authenticode."
          }

          $signing = if ($hasCertificate) { 'signed' } else { 'unsigned-prerelease' }
          "TITI_RELEASE_SIGNING=$signing" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Procurar segredos versionados
        run: pnpm security:secrets

      - name: Auditar dependências do aplicativo
        run: pnpm audit --audit-level high

      - name: Instalar e validar a landing page
        run: |
          npm ci --prefix landing
          npm audit --prefix landing --audit-level high
          npm test --prefix landing

      - name: Preparar Electron sem corrida entre testes
        run: pnpm setup:electron

      - name: Validar tipos e testes
        run: |
          pnpm typecheck
          pnpm test

      - name: Restaurar cache do runtime de voz
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: runtime/whisper
          key: whisper-win-v1.9.2-parakeet-tdt-v3-q8-4d64e9e96c2792186d072fde0034df0ad670cf680a2f53069052ead827fd600e

      - name: Preparar runtime de transcrição verificado
        run: pnpm setup:whisper

      - name: Restaurar cache da voz neural
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: runtime/supertonic/model-extracted
          key: supertonic-3-int8-82fa96f91c4ef8abaa3a14a3f4153facf88bed821d1f7331cec2700f432c427

      - name: Preparar voz neural local verificada
        run: pnpm setup:tts

      - name: Gerar instalador NSIS do commit da tag
        run: pnpm package:win

      - name: Validar metadados e assinatura
        shell: pwsh
        run: |
          pnpm qa:release-sync
          if ($env:TITI_RELEASE_SIGNING -eq 'signed') {
            pnpm verify:signatures
          } else {
            pnpm verify:signatures -- --allow-unsigned-prerelease
          }

      - name: Gerar manifesto e checksums dos ativos exatos
        shell: pwsh
        run: >-
          node scripts/prepare-release-assets.mjs
          --tag "$env:TITI_RELEASE_TAG"
          --commit "$env:TITI_RELEASE_COMMIT"
          --signing "$env:TITI_RELEASE_SIGNING"

      - name: Enviar ativos para uma release ainda não pública
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $installer = "release/Titi-Setup-$version.exe"
          $assets = @(
            $installer,
            "$installer.blockmap",
            'release/latest.yml',
            'release/SHA256SUMS.txt',
            'release/release-manifest.json'
          )

          $existingJson = & gh release view $env:TITI_RELEASE_TAG --json isDraft,tagName 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            $existing = $existingJson | ConvertFrom-Json
            if (-not $existing.isDraft) {
              throw "A release $env:TITI_RELEASE_TAG já está pública; tags publicadas não podem ser reutilizadas."
            }

            $editArguments = @(
              'release', 'edit', $env:TITI_RELEASE_TAG,
              '--title', "Titi $version",
              '--notes-file', 'RELEASE_NOTES.md',
              '--draft=true'
            )
            if ($version.Contains('-')) {
              $editArguments += '--prerelease=true'
            } else {
              $editArguments += '--prerelease=false'
            }
            & gh @editArguments
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao atualizar o rascunho retomável de $env:TITI_RELEASE_TAG."
            }
            & gh release upload $env:TITI_RELEASE_TAG @assets --clobber
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao substituir os ativos do rascunho retomável de $env:TITI_RELEASE_TAG."
            }
            "Rascunho existente retomado com segurança; nenhuma release pública foi sobrescrita." |
              Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append
          } else {
            $arguments = @(
              'release', 'create', $env:TITI_RELEASE_TAG,
              '--verify-tag', '--title', "Titi $version",
              '--notes-file', 'RELEASE_NOTES.md', '--draft'
            )
            if ($version.Contains('-')) {
              $arguments += '--prerelease'
            }
            $arguments += $assets
            & gh @arguments
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao criar o rascunho da release $env:TITI_RELEASE_TAG."
            }
          }

      - name: Baixar novamente e comparar todos os ativos
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $assetNames = @(
            "Titi-Setup-$version.exe",
            "Titi-Setup-$version.exe.blockmap",
            'latest.yml',
            'SHA256SUMS.txt',
            'release-manifest.json'
          )
          $downloadRoot = Join-Path $env:RUNNER_TEMP "titi-release-$env:GITHUB_RUN_ID"
          New-Item -ItemType Directory -Path $downloadRoot | Out-Null

          foreach ($assetName in $assetNames) {
            gh release download $env:TITI_RELEASE_TAG --dir $downloadRoot --pattern $assetName
            if ($LASTEXITCODE -ne 0) {
              throw "Falha ao baixar novamente $assetName."
            }

            $localHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path 'release' $assetName)).Hash
            $publishedHash = (Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $downloadRoot $assetName)).Hash
            if ($localHash -ne $publishedHash) {
              throw "O ativo publicado $assetName não corresponde ao arquivo verificado."
            }
          }

          Get-Content -LiteralPath release/SHA256SUMS.txt | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8 -Append

      - name: Tornar pública somente a release já conferida
        shell: pwsh
        run: |
          $version = (Get-Content -LiteralPath package.json -Raw | ConvertFrom-Json).version
          $arguments = @('release', 'edit', $env:TITI_RELEASE_TAG, '--draft=false')
          if ($version.Contains('-')) {
            $arguments += '--prerelease=true'
          } else {
            $arguments += '--prerelease=false'
          }
          & gh @arguments
          if ($LASTEXITCODE -ne 0) {
            throw "Os ativos foram validados, mas não foi possível publicar a release $env:TITI_RELEASE_TAG."
          }
