name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tipos, testes e pacote verificável
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Preparar Electron sem corrida entre testes
        run: pnpm setup:electron

      - name: Validar tipos
        run: pnpm typecheck

      - name: Executar testes
        run: pnpm test

      - name: Restaurar cache do runtime de voz
        uses: actions/cache@v4
        with:
          path: runtime/whisper
          key: whisper-win-v1.9.2-parakeet-tdt-v3-q8-4d64e9e96c2792186d072fde0034df0ad670cf680a2f53069052ead827fd600e

      - name: Preparar runtime de voz verificado
        run: pnpm setup:whisper

      - name: Restaurar cache da voz neural
        uses: actions/cache@v4
        with:
          path: runtime/supertonic/model-extracted
          key: supertonic-3-int8-82fa96f91c4ef8abaa3a14a3f4153facf88bed821d1f7331cec2700f432c427

      - name: Preparar voz neural local verificada
        run: pnpm setup:tts

      - name: Gerar e verificar pacote de produção
        run: pnpm package:dir
