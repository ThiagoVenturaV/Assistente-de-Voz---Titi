name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tipos, testes e pacote verificável
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Baixar o código
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Preparar pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.22.0

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Procurar segredos versionados
        run: pnpm security:secrets

      - name: Auditar dependências do aplicativo
        run: pnpm audit --audit-level high

      - name: Instalar e auditar a landing page
        run: npm ci --prefix landing

      - name: Auditar dependências da landing page
        run: npm audit --prefix landing --audit-level high

      - name: Testar a landing page
        run: npm test --prefix landing

      - name: Preparar Electron sem corrida entre testes
        run: pnpm setup:electron

      - name: Validar tipos
        run: pnpm typecheck

      - name: Executar testes
        run: pnpm test

      - name: Restaurar cache do runtime de voz
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/whisper
          key: whisper-win-v1.9.2-parakeet-tdt-v3-q8-4d64e9e96c2792186d072fde0034df0ad670cf680a2f53069052ead827fd600e

      - name: Preparar runtime de voz verificado
        run: pnpm setup:whisper

      - name: Restaurar cache da voz neural
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: runtime/supertonic/model-extracted
          key: supertonic-3-int8-82fa96f91c4ef8abaa3a14a3f4153facf88bed821d1f7331cec2700f432c427

      - name: Preparar voz neural local verificada
        run: pnpm setup:tts

      - name: Gerar e verificar pacote de produção
        run: pnpm package:dir
