name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tipos, testes e pacote verificável
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Baixar o código
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Preparar pnpm
        uses: pnpm/action-setup@f40ffcd9367d9f12939873eb1018b921a783ffaa # v4
        with:
          version: 10.22.0

      - name: Preparar Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Procurar segredos versionados
        run: pnpm security:secrets

      - name: Auditar dependências do aplicativo
        run: pnpm audit --prod --audit-level high

      - name: Instalar e auditar a landing page
        run: npm ci --prefix landing

      - name: Auditar dependências da landing page
        run: npm audit --prefix landing --audit-level high

      - name: Testar a landing page
        run: npm test --prefix landing

      - name: Preparar Electron sem corrida entre testes
        run: pnpm setup:electron

      - name: Validar tipos
        run: pnpm typecheck

      - name: Executar testes
        run: pnpm test

      - name: Restaurar cache do runtime de voz LFM3
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: runtime/lfm3
          key: lfm3-b11998-audio-2b-q4km-9a773289bd321ed879cd3a76545f6aca506e403851a45fb315420aee45625be2

      - name: Preparar runtime de voz LFM3 verificado
        run: pnpm setup:whisper

      - name: Gerar e verificar pacote de produção
        run: pnpm package:dir
