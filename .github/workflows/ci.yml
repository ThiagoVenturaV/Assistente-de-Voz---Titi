name: Qualidade

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Tipos, testes e pacote verificável
    runs-on: windows-latest
    timeout-minutes: 35

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Preparar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.22.0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependências
        run: pnpm install --frozen-lockfile

      - name: Preparar Electron sem corrida entre testes
        run: pnpm setup:electron

      - name: Validar tipos
        run: pnpm typecheck

      - name: Executar testes
        run: pnpm test

      - name: Restaurar cache do runtime de voz
        uses: actions/cache@v4
        with:
          path: runtime/whisper
          key: whisper-win-v1.9.2-large-v3-turbo-q8-317eb69c11673c9de1e1f0d459b253999804ec71ac4c23c17ecf5fbe24e259a1-vad-v6.2

      - name: Preparar runtime de voz verificado
        run: pnpm setup:whisper

      - name: Gerar e verificar pacote de produção
        run: pnpm package:dir
